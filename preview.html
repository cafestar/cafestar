
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#071b16">
<title>Coffee Star</title>

<style>
* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  min-height: 100%;
  background: #071b16;
}

body {
  display: flex;
  justify-content: center;
  align-items: flex-start;
}

.site {
  width: 100%;
  max-width: 900px;
  position: relative;
  line-height: 0;
}

.site img {
  display: block;
  width: 100%;
  height: auto;
}

.hotspot {
  position: absolute;
  display: block;
  z-index: 5;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  background: transparent;
  border: 0;
  padding: 0;
}

.hotspot:focus-visible {
  outline: 2px solid #a7f3d0;
  border-radius: 10px;
}

.explore { left:6%; top:29.5%; width:27%; height:4.2%; }
.menu-hot { left:6%; top:41.3%; width:44%; height:16%; }
.menu-cold { left:51%; top:41.3%; width:43%; height:16%; }
.copy-card { left:80%; top:67.5%; width:16%; height:4.5%; }
.whatsapp { left:5%; top:74.5%; width:44%; height:8%; }
.barista { left:51%; top:74.5%; width:44%; height:8%; }
.location { left:5%; top:88%; width:38%; height:9%; }
.instagram { left:43%; top:88%; width:51%; height:9%; }
</style>
</head>

<body>

<main class="site">

<img
src="4D5A40A6-7BA6-4516-B062-9A582CC90CA3.png"
alt="Coffee Star Website"
>

<a class="hotspot explore"
href="#"
aria-label="Explore"
onclick="window.scrollTo({top:0,behavior:'smooth'}); return false;">
</a>

<a class="hotspot menu-hot"
href="menu-1.jpeg"
target="_blank"
aria-label="منوی قهوه گرم">
</a>

<a class="hotspot menu-cold"
href="menu-2.jpeg"
target="_blank"
aria-label="منوی قهوه سرد">
</a>

<button class="hotspot copy-card"
onclick="copyCard()"
aria-label="کپی شماره کارت">
</button>

<a class="hotspot whatsapp"
href="https://wa.me/989120473291?text=%D8%B3%D9%84%D8%A7%D9%85%D8%8C%20%D8%B1%D8%B3%DB%8C%D8%AF%20%D9%BE%D8%B1%D8%AF%D8%A7%D8%AE%D8%AA%20%D9%85%D9%86"
target="_blank"
aria-label="ارسال رسید در واتساپ">
</a>

<button class="hotspot barista"
onclick="showBarista()"
aria-label="نمایش رسید به باریستا">
</button>

<a class="hotspot location"
href="https://www.google.com/maps/search/?api=1&query=کرج+شاهین+ویلا+بلوار+باهنر+نبش+مدرس+جنوبی"
target="_blank"
aria-label="مسیریابی کافه">
</a>

<a class="hotspot instagram"
href="https://instagram.com/cafe_s_t_a_r"
target="_blank"
aria-label="اینستاگرام کافه">
</a>

</main>

<script>
function copyCard() {
  const cardNumber = "6219861082150367";

  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(cardNumber)
      .then(() => alert("شماره کارت کپی شد ☕"))
      .catch(() => fallbackCopy(cardNumber));
  } else {
    fallbackCopy(cardNumber);
  }
}

function fallbackCopy(text) {
  const input = document.createElement("textarea");
  input.value = text;
  document.body.appendChild(input);
  input.select();

  try {
    document.execCommand("copy");
    alert("شماره کارت کپی شد ☕");
  } catch (e) {
    alert("شماره کارت: " + text);
  }

  input.remove();
}

function showBarista() {
  alert("لطفاً رسید پرداخت را به باریستا نشان دهید ☕");
}
</script>

</body>
</html>
